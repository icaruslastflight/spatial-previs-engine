name: Deploy to GitHub Pages

# Mirrors GitHub's own current static-content-to-Pages template (checkout,
# configure-pages, upload-pages-artifact, deploy-pages at the versions and in
# the arrangement that template uses), with the generic "upload the repo"
# step replaced by this project's own production build -- see CLAUDE.md §5.
# DEPLOY_TARGET=gh-pages switches Vite's `base` to '/spatial-previs-engine/'
# (a GitHub project page is served from a subpath, not the domain root) and
# CESIUM_BASE_URL derives from that same base so Cesium's runtime asset
# fetches resolve correctly once deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          DEPLOY_TARGET: gh-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
