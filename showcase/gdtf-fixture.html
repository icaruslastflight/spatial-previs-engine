<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Festival Visualizer — GDTF Fixture Showcase</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8eaf0;
        --dim: #8b93a7;
        --accent: #6ee7ff;
        --panel: rgba(12, 14, 20, 0.82);
        --line: rgba(110, 231, 255, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        color: var(--ink);
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow: hidden;
      }

      #stage {
        position: fixed;
        inset: 0;
        touch-action: none;
      }

      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        backdrop-filter: blur(12px);
      }

      #title {
        top: 18px;
        left: 18px;
        max-width: 460px;
      }

      #title h1 {
        margin: 0 0 4px;
        font-size: 15px;
        letter-spacing: 0.04em;
        color: var(--accent);
      }

      #title p {
        margin: 0;
        color: var(--dim);
        font-size: 11.5px;
      }

      #profile {
        top: 18px;
        right: 18px;
        min-width: 290px;
      }

      #profile h2 {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 11.5px;
      }

      td {
        padding: 2px 0;
        vertical-align: top;
      }

      td.k {
        color: var(--dim);
        padding-right: 14px;
        white-space: nowrap;
      }

      td.v {
        color: var(--ink);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      #legend {
        left: 18px;
        bottom: 18px;
        display: flex;
        gap: 22px;
      }

      .fx {
        text-align: center;
      }

      .fx .name {
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      .fx .val {
        color: var(--dim);
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
      }

      #status {
        right: 18px;
        bottom: 18px;
        color: var(--dim);
        font-size: 10.5px;
      }

      #status b {
        color: #7dffa8;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div class="panel" id="title">
      <h1>GDTF RUNTIME ASSET RESOLVER</h1>
      <p>
        Fixtures below are parsed from real <code>.gdtf</code> archives (DIN SPEC 15800) and
        assembled by <code>GDTFAssetResolver</code> — kinematic chain, photometric cone and
        socket metadata all read from <code>description.xml</code>.
      </p>
    </div>

    <div class="panel" id="profile">
      <h2>Parsed profile</h2>
      <table id="profile-table"></table>
    </div>

    <div class="panel" id="legend"></div>
    <div class="panel" id="status">initialising…</div>

    <script type="module" src="./gdtf-fixture.ts"></script>
  </body>
</html>
